<!DOCTYPE html>
<html lang="bn">
<head>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif;
            background-color: #e2e8f0;
            color: #0f172a;
        }

        /* Custom Scrollbar for App Container */
        .app-scroll::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .app-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .app-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        /* Print Styles for Thermal / PDF Invoice */
        @media print {
            body * {
                visibility: hidden;
            }
            #print-area, #print-area * {
                visibility: visible;
            }
            #print-area {
                position: fixed;
                left: 0;
                top: 0;
                width: 100%;
                max-width: 100% !important;
                box-shadow: none !important;
                border: none !important;
                padding: 16px !important;
                background: #ffffff !important;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>

        // Repository Methods
        function getDB() {
            const raw = localStorage.getItem(DB_KEY);
            if (!raw) {
                localStorage.setItem(DB_KEY, JSON.stringify(defaultSeedData));
                return JSON.parse(JSON.stringify(defaultSeedData));
            }
            return JSON.parse(raw);
        }

        function saveDB(db) {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }

        function resetDemoDatabase() {
            localStorage.setItem(DB_KEY, JSON.stringify(defaultSeedData));

            toggleDrawer(false);
            if (currentUser) navigateHome();

        function showToast(msg, type = 'success') {
            const box = document.getElementById('toast-box');
            const content = document.getElementById('toast-content');
            const icon = document.getElementById('toast-icon');
            const text = document.getElementById('toast-msg');

            text.textContent = msg;
            icon.className = type === 'error'
                ? 'fas fa-exclamation-circle text-rose-400 text-base'
                : 'fas fa-check-circle text-emerald-400 text-base';

            box.classList.remove('hidden');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => {
                box.classList.add('hidden');
            }, 3000);
        }

        function toggleDrawer(open) {
            const drawer = document.getElementById('nav-drawer');
            if (open) drawer.classList.remove('hidden');
            else drawer.classList.add('hidden');
        }

        function openModal(title, htmlContent) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = htmlContent;
            document.getElementById('app-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('app-modal').classList.add('hidden');
        }

        function navigateHome() {
            if (!currentUser) return navigateTo('login');
            if (currentUser.role === 'admin') navigateTo('admin_dashboard');
            else if (currentUser.role === 'staff') navigateTo('diagnostic_entry');
            else navigateTo('patient_home');
        }

        function navigateTo(route, param = null) {
            const prevRoute = currentRoute;
            const viewport = document.getElementById('main-viewport');
            const prevScrollTop = viewport ? viewport.scrollTop : 0;

            currentRoute = route;
            toggleDrawer(false);
            updateChromeUI();

            const activeViewport = document.getElementById('main-viewport');
            activeViewport.scrollTop = (prevRoute === route) ? prevScrollTop : 0;

            switch (route) {
                case 'login':
                    viewport.innerHTML = renderLoginScreen();
                    break;
                case 'register':
                    viewport.innerHTML = renderRegisterScreen();
                    break;
                case 'patient_home':
                    viewport.innerHTML = renderPatientHome();
                    break;
                case 'service_detail':
                    viewport.innerHTML = renderServiceDetail(param);
                    break;
                case 'diagnostic_entry':
                    viewport.innerHTML = renderDiagnosticEntry();
                    recalcDiagnosticTotals();
                    break;
                case 'order_processing':
                    viewport.innerHTML = renderOrderProcessing();
                    break;
                case 'submit_trx':
                    viewport.innerHTML = renderSubmitTransaction();
                    break;
                case 'my_orders':
                    viewport.innerHTML = renderOrdersAndInvoices();
                    break;
                case 'admin_dashboard':
                    viewport.innerHTML = renderAdminSettingsDashboard();
                    break;
                case 'admin_cms':
                    if (param) activeCmsTab = param;
                    viewport.innerHTML = renderAdminCMS();
                    break;
                case 'admin_payments':
                    viewport.innerHTML = renderAdminPaymentChannels();
                    break;
                case 'admin_users':
                    viewport.innerHTML = renderAdminUserManagement();
                    break;
                case 'admin_sales':
                    viewport.innerHTML = renderAdminSalesReport();
                    break;
                case 'profile':
                    viewport.innerHTML = renderProfileScreen();
                    break;
                default:
                    viewport.innerHTML = renderLoginScreen();
            }
        }

        function updateChromeUI() {

        function handleRegister(e) {
            e.preventDefault();
            const fullName = document.getElementById('reg-name').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-pass').value.trim();

            const db = getDB();
            if (db.users.some(u => u.username.toLowerCase() === username.toLowerCase() || u.phone === phone)) {
                showToast('এই ইউজারনেম বা ফোন নম্বরটি ইতিমধ্যে ব্যবহৃত হয়েছে!', 'error');
                return;
            }

            const newUser = {
                id: Date.now(),
                fullName,
                phone,
                username,
                password,
                role: 'patient'
            };
            db.users.push(newUser);
            saveDB(db);

            currentUser = newUser;
            showToast('অ্যাকাউন্ট সফলভাবে তৈরি হয়েছে!', 'success');
            navigateTo('patient_home');
        }

        function openServiceRequestModal(serviceTitle, summary, amount) {
            openModal('Confirm Service Request', `
                <form onsubmit="submitServiceRequest(event, '${serviceTitle.replace(/'/g, "\\'")}', '${summary.replace(/'/g, "\\'")}', ${amount})" class="space-y-3">
                    <div class="p-3 bg-teal-50 border border-teal-200 rounded-xl">
                        <p class="text-xs font-bold text-teal-900">${serviceTitle}</p>
                        <p class="text-[11px] text-teal-700 mt-0.5">${summary}</p>
                        <p class="text-sm font-extrabold text-teal-800 mt-1">Estimated Fee: ${amount} TK</p>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-600 block mb-1">Patient Name</label>
                        <input id="req-patient-name" type="text" required value="${currentUser.fullName}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-600 block mb-1">Contact Phone</label>
                        <input id="req-patient-phone" type="tel" required value="${currentUser.phone}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-600 block mb-1">Delivery / Pickup Address & Notes</label>
                        <textarea id="req-patient-address" rows="2" required placeholder="আপনার বর্তমান ঠিকানা ও বিস্তারিত লিখুন..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs"></textarea>
                    </div>
                    <button type="submit" class="w-full py-3 bg-teal-600 text-white font-bold rounded-xl text-xs shadow">
                        ${amount > 0 ? 'Proceed to Payment' : 'Confirm Emergency Request'}
                    </button>
                </form>
            `);
        }

        function submitServiceRequest(e, serviceTitle, summary, amount) {
            e.preventDefault();
            const pName = document.getElementById('req-patient-name').value.trim();
            const pPhone = document.getElementById('req-patient-phone').value.trim();
            const pAddr = document.getElementById('req-patient-address').value.trim();

            closeModal();

            const orderObj = {
                id: Date.now(),
                orderNo: '#' + Math.floor(100000000 + Math.random() * 900000000),
                type: 'Service Request',
                patientName: pName,
                contactNumber: pPhone,
                address: pAddr,
                items: [{ name: `${serviceTitle} (${summary})`, rate: amount }],
                itemTotal: amount,
                vatPercent: 0,
                totalVat: 0,
                discount: 0,
                totalBill: amount,
                payAmount: amount,
                due: 0,
                paymentChannel: 'Pending Selection',
                transactionId: '',
                status: amount === 0 ? 'Requested' : 'Pending Payment',
                createdBy: currentUser.username,
                createdAt: new Date().toLocaleString()
            };

            if (amount === 0) {
                const db = getDB();
                db.orders.unshift(orderObj);
                saveDB(db);
                showToast('রক্তের রিকোয়েস্ট সফলভাবে পাঠানো হয়েছে!', 'success');
                navigateTo('my_orders');
            } else {
                activeOrderDraft = orderObj;
                navigateTo('order_processing');
            }
        }

        function handleDoctorCodeLookup(code) {
            diagFormState.doctorCode = code;
            const db = getDB();
            const doc = db.doctors.find(d => d.code && d.code.toLowerCase() === code.trim().toLowerCase());
            if (doc) {
                diagFormState.doctorName = doc.name;
                diagFormState.doctorSpeciality = doc.specialization;
                document.getElementById('diag-d-name').value = doc.name;
                document.getElementById('diag-d-spec').value = doc.specialization;
                showToast(`Doctor matched: ${doc.name}`, 'success');
            }
        }

        function addCatalogTestToOrder() {
            const select = document.getElementById('diag-catalog-select');
            const testId = Number(select.value);
            if (!testId) return;
            const db = getDB();
            const test = db.tests.find(t => t.id === testId);
            if (test) {
                diagFormState.items.push({ name: test.testName, rate: test.price });
                diagFormState.discount += (test.discountAmount || 0);
                navigateTo('diagnostic_entry');
                recalcDiagnosticTotals(true);
            }
        }

        function addBlankDiagItem() {
            diagFormState.items.push({ name: '', rate: 0 });
            navigateTo('diagnostic_entry');
        }

        function updateDiagItem(idx, field, val) {
            diagFormState.items[idx][field] = field === 'rate' ? Number(val || 0) : val;
            if (field === 'rate') recalcDiagnosticTotals(true);
        }

        function removeDiagItem(idx) {
            diagFormState.items.splice(idx, 1);
            navigateTo('diagnostic_entry');
            recalcDiagnosticTotals(true);
        }

        function cancelDiagOrder() {
            diagFormState = {
                patientName: '', age: '', gender: 'Male', maritalStatus: 'Married', bloodGroup: 'O+', contact: '', address: '',
                doctorCode: '', doctorName: '', doctorSpeciality: '',
                items: [{ name: '', rate: 0 }],
                vatPercent: 0, discount: 0, payAmount: 0
            };
            showToast('অর্ডার ফর্ম ক্লিয়ার করা হয়েছে', 'success');
            navigateTo('diagnostic_entry');
        }

        function recalcDiagnosticTotals(syncPay = true) {
            const itemTotal = diagFormState.items.reduce((sum, it) => sum + Number(it.rate || 0), 0);
            const vatAmt = Math.round((itemTotal * Number(diagFormState.vatPercent || 0)) / 100);
            const totalBill = Math.max(0, (itemTotal + vatAmt) - Number(diagFormState.discount || 0));

            if (syncPay) {
                diagFormState.payAmount = totalBill;
            }
            const due = Math.max(0, totalBill - Number(diagFormState.payAmount || 0));

            const elItem = document.getElementById('bill-item-total');
            const elTotal = document.getElementById('bill-total');
            const elPay = document.getElementById('bill-pay');
            const elDue = document.getElementById('bill-due');

            if (elItem) elItem.value = itemTotal;
            if (elTotal) elTotal.value = totalBill;
            if (elPay && syncPay) elPay.value = diagFormState.payAmount;
            if (elDue) elDue.value = due;
        }

        function finalizeDiagnosticOrder(mode) {
            if (!diagFormState.patientName.trim()) {
                showToast('দয়া করে রোগীর নাম লিখুন!', 'error');
                return;
            }
            const validItems = diagFormState.items.filter(i => i.name.trim());
            if (validItems.length === 0) {
                showToast('কমপক্ষে একটি টেস্ট আইটেম যুক্ত করুন!', 'error');
                return;
            }

            const itemTotal = validItems.reduce((sum, it) => sum + Number(it.rate || 0), 0);
            const totalVat = Math.round((itemTotal * Number(diagFormState.vatPercent || 0)) / 100);
            const totalBill = Math.max(0, (itemTotal + totalVat) - Number(diagFormState.discount || 0));
            const payAmount = Number(diagFormState.payAmount || 0);
            const due = Math.max(0, totalBill - payAmount);

            const orderObj = {
                id: Date.now(),
                orderNo: '#' + Math.floor(100000000 + Math.random() * 900000000),
                type: 'Diagnostic Bill',
                patientName: diagFormState.patientName,
                patientAge: diagFormState.age,
                gender: diagFormState.gender,
                maritalStatus: diagFormState.maritalStatus,
                bloodGroup: diagFormState.bloodGroup,
                contactNumber: diagFormState.contact,
                address: diagFormState.address,
                doctorCode: diagFormState.doctorCode,
                doctorName: diagFormState.doctorName,
                doctorSpeciality: diagFormState.doctorSpeciality,
                items: validItems,
                itemTotal,
                vatPercent: diagFormState.vatPercent,
                totalVat,
                discount: diagFormState.discount,
                totalBill,
                payAmount,
                due,
                paymentChannel: mode === 'save' ? 'Cash Counter' : 'Pending Online Payment',
                transactionId: mode === 'save' ? 'CASH-' + Math.floor(1000 + Math.random() * 9000) : '',
                status: mode === 'save' ? (due > 0 ? 'Partial Paid' : 'Approved') : 'Pending Payment',
                createdBy: currentUser.username,
                createdAt: new Date().toLocaleString()
            };

            if (mode === 'save') {
                const db = getDB();
                db.orders.unshift(orderObj);
                saveDB(db);
                showToast('ইনভয়েস সেভ হয়েছে! রসিদ প্রিন্ট বা ডাউনলোড করুন।', 'success');
                openInvoicePrintModal(orderObj.id);
                navigateTo('my_orders');
            } else {
                activeOrderDraft = orderObj;
                navigateTo('order_processing');
            }
        }

        function openCmsFormModal(tabKey, editId = null) {
            const db = getDB();
            const schema = cmsSchemas[tabKey];
            const existing = editId ? (db[tabKey] || []).find(x => x.id === editId) : null;

            const fieldsHtml = schema.fields.map(f => {
                const val = existing ? existing[f.key] : '';
                if (f.type === 'selectBool') {
                    return `
                        <div>
                            <label class="text-xs font-bold text-slate-600 block mb-1">${f.label}</label>
                            <select id="cms-field-${f.key}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                                <option value="true" ${val === true || val === '' ? 'selected' : ''}>Available</option>
                                <option value="false" ${val === false ? 'selected' : ''}>Unavailable</option>
                            </select>
                        </div>
                    `;
                }
                return `
                    <div>
                        <label class="text-xs font-bold text-slate-600 block mb-1">${f.label}</label>
                        <input id="cms-field-${f.key}" type="${f.type}" ${f.required ? 'required' : ''} value="${val ?? ''}"
                            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                    </div>
                `;
            }).join('');

            openModal(`${existing ? 'Edit' : 'Add'} ${schema.title}`, `
                <form onsubmit="saveCmsRecord(event, '${tabKey}', ${editId})" class="space-y-3">
                    ${fieldsHtml}
                    <div class="grid grid-cols-2 gap-2 pt-2">
                        <button type="button" onclick="closeModal()" class="py-2.5 bg-slate-100 text-slate-700 rounded-xl text-xs font-bold">Cancel</button>
                        <button type="submit" class="py-2.5 bg-teal-600 text-white rounded-xl text-xs font-bold shadow">Save Data</button>
                    </div>
                </form>
            `);
        }

        function saveCmsRecord(e, tabKey, editId) {
            e.preventDefault();
            const db = getDB();
            const schema = cmsSchemas[tabKey];
            const record = editId ? { ...db[tabKey].find(x => x.id === editId) } : { id: Date.now() };

            schema.fields.forEach(f => {
                const el = document.getElementById(`cms-field-${f.key}`);
                if (!el) return;
                if (f.type === 'number') record[f.key] = Number(el.value || 0);
                else if (f.type === 'selectBool') record[f.key] = el.value === 'true';
                else record[f.key] = el.value.trim();
            });

            if (editId) {
                const idx = db[tabKey].findIndex(x => x.id === editId);
                if (idx !== -1) db[tabKey][idx] = record;
            } else {
                db[tabKey].unshift(record);
            }

            saveDB(db);
            closeModal();
            showToast(`${schema.title} সফলভাবে সেভ হয়েছে!`, 'success');
            navigateTo('admin_cms', tabKey);
        }

        function deleteCmsRecord(tabKey, id) {
            const db = getDB();
            db[tabKey] = (db[tabKey] || []).filter(x => x.id !== id);
            saveDB(db);
            showToast('রেকর্ডটি ডিলিট করা হয়েছে।', 'success');
            navigateTo('admin_cms', tabKey);
        }

            navigateTo('admin_payments');
        }

        function deletePaymentChannel(id) {
            const db = getDB();
            db.paymentChannels = db.paymentChannels.filter(x => x.id !== id);
            saveDB(db);
            showToast('পেমেন্ট চ্যানেল ডিলিট হয়েছে।', 'success');
            navigateTo('admin_payments');
        }

        // =========================================================================
        // 10. ADMIN USER MANAGEMENT, SALES REPORT & PROFILE
        // =========================================================================
        function renderAdminUserManagement() {
            const db = getDB();
            return `
                <div class="p-4 space-y-4">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <button onclick="navigateTo('admin_dashboard')" class="w-8 h-8 rounded-xl bg-white border border-slate-200 flex items-center justify-center text-slate-600">
                                <i class="fas fa-arrow-left text-xs"></i>
                            </button>
                            <h2 class="text-base font-extrabold text-slate-800">User Management</h2>
                        </div>
                    </div>

                    <!-- Create Staff / Admin / Patient User -->
                    <form onsubmit="adminCreateUser(event)" class="bg-white p-4 rounded-2xl border border-slate-200 shadow-2xs space-y-2.5">
                        <h3 class="text-xs font-extrabold text-teal-700 uppercase">Add Staff / Admin / User</h3>
                        <input id="au-name" type="text" required placeholder="Full Name" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                        <div class="grid grid-cols-2 gap-2">
                            <input id="au-phone" type="tel" required placeholder="Phone Number" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                            <select id="au-role" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold">
                                <option value="staff">Diagnostic Staff</option>
                                <option value="admin">Super Admin</option>
                                <option value="patient">Patient / User</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <input id="au-user" type="text" required placeholder="Username" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                            <input id="au-pass" type="text" required placeholder="Password" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                        </div>
                        <button type="submit" class="w-full py-2.5 bg-teal-600 text-white rounded-xl text-xs font-bold">Create User Account</button>
                    </form>

                    <!-- Users List -->
                    <div class="space-y-2">
                        ${db.users.map(u => `
                            <div class="bg-white p-3.5 rounded-2xl border border-slate-200 flex items-center justify-between">
                                <div>
                                    <h4 class="font-bold text-sm text-slate-800">${u.fullName}</h4>
                                    <p class="text-xs text-slate-500">@${u.username} • ${u.phone}</p>
                                </div>
                                <span class="px-2.5 py-1 rounded-lg text-[10px] font-extrabold uppercase ${
                                    u.role === 'admin' ? 'bg-slate-800 text-white' :
                                    u.role === 'staff' ? 'bg-blue-100 text-blue-700' : 'bg-teal-100 text-teal-700'
                                }">${u.role}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function adminCreateUser(e) {
            e.preventDefault();
            const db = getDB();
            db.users.push({
                id: Date.now(),
                fullName: document.getElementById('au-name').value.trim(),
                phone: document.getElementById('au-phone').value.trim(),
                role: document.getElementById('au-role').value,
                username: document.getElementById('au-user').value.trim(),
                password: document.getElementById('au-pass').value.trim()
            });
            saveDB(db);
            showToast('নতুন ইউজার তৈরি হয়েছে!', 'success');
            navigateTo('admin_users');
        }

        function renderAdminSalesReport() {
            const db = getDB();
            const totalBilled = db.orders.reduce((s, o) => s + Number(o.totalBill || 0), 0);
            const totalPaid = db.orders.reduce((s, o) => s + Number(o.payAmount || 0), 0);
            const totalDue = db.orders.reduce((s, o) => s + Number(o.due || 0), 0);
            const pendingCount = db.orders.filter(o => o.status === 'Pending Verification').length;

            return `
                <div class="p-4 space-y-4">
                    <div class="flex items-center gap-2">
                        <button onclick="navigateTo('admin_dashboard')" class="w-8 h-8 rounded-xl bg-white border border-slate-200 flex items-center justify-center text-slate-600">
                            <i class="fas fa-arrow-left text-xs"></i>
                        </button>
                        <h2 class="text-base font-extrabold text-slate-800">Sales & Dashboard Summary</h2>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-2xs">
                            <p class="text-[11px] text-slate-400 font-bold uppercase">Total Sales</p>
                            <h3 class="text-lg font-extrabold text-slate-800 mt-1">${totalBilled.toLocaleString()} ৳</h3>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-2xs">
                            <p class="text-[11px] text-slate-400 font-bold uppercase">Collected (Paid)</p>
                            <h3 class="text-lg font-extrabold text-emerald-600 mt-1">${totalPaid.toLocaleString()} ৳</h3>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-2xs">
                            <p class="text-[11px] text-slate-400 font-bold uppercase">Total Due</p>
                            <h3 class="text-lg font-extrabold text-rose-600 mt-1">${totalDue.toLocaleString()} ৳</h3>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-2xs">
                            <p class="text-[11px] text-slate-400 font-bold uppercase">Pending Trx</p>
                            <h3 class="text-lg font-extrabold text-amber-600 mt-1">${pendingCount} Orders</h3>
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-2xl border border-slate-200 space-y-2 text-xs">
                        <h3 class="font-extrabold text-slate-700 uppercase">System Database Overview</h3>
                        <p class="flex justify-between py-1 border-b border-slate-100"><span>Consultants & Doctors:</span><strong>${db.consultants.length + db.doctors.length}</strong></p>
                        <p class="flex justify-between py-1 border-b border-slate-100"><span>Nurses & Aya Caregivers:</span><strong>${db.nurses.length + db.ayas.length}</strong></p>
                        <p class="flex justify-between py-1 border-b border-slate-100"><span>Diagnostic Tests Catalog:</span><strong>${db.tests.length}</strong></p>
                        <p class="flex justify-between py-1 border-b border-slate-100"><span>Registered Blood Donors:</span><strong>${db.bloodDonors.length}</strong></p>
                        <p class="flex justify-between py-1"><span>Active Payment Channels:</span><strong>${db.paymentChannels.length}</strong></p>
                    </div>
                </div>
            `;
        }

        function renderProfileScreen() {
            return `
                <div class="p-4 space-y-4">
                    <h2 class="text-base font-extrabold text-slate-800">Profile Setting</h2>
                    <div class="bg-white p-5 rounded-3xl border border-slate-200 space-y-3">
                        <div class="flex items-center gap-3 pb-3 border-b border-slate-100">
                            <div class="w-14 h-14 rounded-2xl bg-teal-600 text-white flex items-center justify-center text-2xl font-bold">
                                <i class="fas fa-user"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-base text-slate-800">${currentUser.fullName}</h3>
                                <p class="text-xs text-slate-500">@${currentUser.username} • Role: <strong class="uppercase">${currentUser.role}</strong></p>
                            </div>
                        </div>
                        <form onsubmit="updateProfile(event)" class="space-y-3">
                            <div>
                                <label class="text-xs font-bold text-slate-600">Full Name</label>
                                <input id="prof-name" type="text" required value="${currentUser.fullName}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs mt-1">
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-600">Phone Number</label>
                                <input id="prof-phone" type="tel" required value="${currentUser.phone}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs mt-1">
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-600">New Password</label>
                                <input id="prof-pass" type="text" required value="${currentUser.password}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs mt-1">
                            </div>
                            <button type="submit" class="w-full py-3 bg-teal-600 text-white rounded-xl text-xs font-bold shadow">Update Profile</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function updateProfile(e) {
            e.preventDefault();
            const db = getDB();
            const u = db.users.find(x => x.id === currentUser.id);
            if (u) {
                u.fullName = document.getElementById('prof-name').value.trim();
                u.phone = document.getElementById('prof-phone').value.trim();
                u.password = document.getElementById('prof-pass').value.trim();
                saveDB(db);
                currentUser = u;
                updateChromeUI();
                showToast('প্রোফাইল আপডেট সম্পন্ন হয়েছে!', 'success');
            }
        }

        // Initialize App on Load
        window.onload = function () {
            getDB(); // Seed localStorage if empty
            navigateTo('login');
        };
    </script>
</body>
</html>
